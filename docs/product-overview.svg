<svg width="680" height="420" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Как устроен продукт: подготовка, обслуживание, потребители</title>
<desc>Авторы знаний пишут Markdown-документы и скиллы. rag-generation индексирует их в ChromaDB и упаковывает скиллы в архивы. Ассистент (rag-offline) обслуживает Web UI и MCP поверх этих данных. Двое потребителей: разработчик через Web UI и code-агент через MCP. Обратная связь (реакция «не то» или новый файл) замыкает цикл обратно к авторам знаний.</desc>

<style>
  .t  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; }
  .th { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; }
  .ts { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; }

  .gray  rect, circle.gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray  .th { fill: #444441; } .gray  .ts { fill: #5F5E5A; }
  .purple rect, circle.purple { fill: #EEEDFE; stroke: #534AB7; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal  rect, circle.teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .teal  .th { fill: #085041; } .teal  .ts { fill: #0F6E56; }
  .coral rect, circle.coral { fill: #FAECE7; stroke: #993C1D; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }

  rect, circle { stroke-width: 0.5; }
  .arr { stroke: #888780; stroke-width: 0.5; fill: none; }
  .dashed { stroke-dasharray: 3 3; }
  .legend { fill: #5F5E5A; }
  .stage { fill: #888780; letter-spacing: .03em; }

  @media (prefers-color-scheme: dark) {
    .gray  rect, circle.gray  { fill: #444441; stroke: #B4B2A9; }
    .gray  .th { fill: #D3D1C7; } .gray  .ts { fill: #B4B2A9; }
    .purple rect, circle.purple { fill: #3C3489; stroke: #AFA9EC; }
    .purple .th { fill: #CECBF6; } .purple .ts { fill: #AFA9EC; }
    .teal  rect, circle.teal  { fill: #085041; stroke: #5DCAA5; }
    .teal  .th { fill: #9FE1CB; } .teal  .ts { fill: #5DCAA5; }
    .coral rect, circle.coral { fill: #712B13; stroke: #F0997B; }
    .coral .th { fill: #F5C4B3; } .coral .ts { fill: #F0997B; }
    .legend { fill: #B4B2A9; }
    .stage { fill: #B4B2A9; }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="ts stage" x="40" y="34">ГОТОВИМ</text>
<g class="gray">
  <rect x="190" y="40" width="300" height="50" rx="4"/>
  <text class="th" x="340" y="60" text-anchor="middle">Markdown-доки + Skills</text>
  <text class="ts" x="340" y="78" text-anchor="middle">пишут авторы знаний</text>
</g>

<line class="arr" x1="340" y1="90" x2="340" y2="118" marker-end="url(#arrow)"/>

<g class="purple">
  <rect x="190" y="120" width="300" height="50" rx="4"/>
  <text class="th" x="340" y="140" text-anchor="middle">rag-generation</text>
  <text class="ts" x="340" y="158" text-anchor="middle">чанкинг · эмбеддинги · архивы</text>
</g>

<line class="arr" x1="340" y1="170" x2="340" y2="198" marker-end="url(#arrow)"/>

<text class="ts stage" x="40" y="214">РАБОТАЕМ</text>
<g class="teal">
  <rect x="190" y="200" width="300" height="54" rx="4"/>
  <text class="th" x="340" y="222" text-anchor="middle">rag-offline (ассистент)</text>
  <text class="ts" x="340" y="240" text-anchor="middle">ChromaDB · Web UI · REST · MCP</text>
</g>

<polyline class="arr" points="340,254 340,268 245,268 245,286" marker-end="url(#arrow)"/>
<polyline class="arr" points="340,254 340,268 475,268 475,286" marker-end="url(#arrow)"/>

<text class="ts stage" x="40" y="302">ИСПОЛЬЗУЮТ</text>
<g class="coral">
  <rect x="140" y="288" width="210" height="52" rx="4"/>
  <text class="th" x="245" y="310" text-anchor="middle">Разработчик</text>
  <text class="ts" x="245" y="327" text-anchor="middle">Web UI: вопросы, скиллы</text>
</g>
<g class="coral">
  <rect x="370" y="288" width="210" height="52" rx="4"/>
  <text class="th" x="475" y="310" text-anchor="middle">Code-агент</text>
  <text class="ts" x="475" y="327" text-anchor="middle">MCP: search_docs · get_skill</text>
</g>

<path class="arr dashed" d="M 245 340 L 245 366 L 62 366 L 62 65 L 188 65" marker-end="url(#arrow)"/>
<text class="ts legend" x="70" y="382">🔁 обратная связь: реакция «не то» → PR с файлом</text>

</svg>
