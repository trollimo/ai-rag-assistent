services:
  # Local LLM. Skip it entirely when pointing at a corporate endpoint:
  #   docker compose up assistant       (starts only the assistant)
  # and set LLM_BASE_URL / LLM_API_KEY / LLM_MODEL_NAME on the assistant.
  llm:
    image: rag-llm:1.7.0
    build:
      context: .
      dockerfile: Dockerfile.llm
      # Pulls the llama-server binary out of an already-built assistant image
      # (no GitHub fetch). Build that image first, or override with a tag you
      # have locally. Fallback if you don't: run fetch-llama-dist.ps1 once and
      # switch Dockerfile.llm's FROM to the archive-based COPY (see its header).
      args:
        - LLAMA_SOURCE_IMAGE=rag-assistant-offline:latest
      additional_contexts:
        - gguf-model=./offline-bundle/models
    container_name: rag-llm
    ports:
      - "9080:9080"   # OpenAI-compatible /v1/chat/completions
    environment:
      - LLM_MODEL_ALIAS=qwen2.5
      - LLM_CTX_SIZE=2048
      # Match the host's physical cores; unset lets llama.cpp decide
      # - LLM_THREADS=6
    restart: unless-stopped

  assistant:
    image: rag-offline:1.15.0
    build:
      context: .
      dockerfile: Dockerfile.offline
      additional_contexts:
        - wheels=./offline-bundle/wheels
        - fastembed-cache=./offline-bundle/fastembed-cache
        - next-standalone=./offline-bundle/next-standalone
        - next-public=./offline-bundle/next-public
        - next-static=./offline-bundle/next-static
    container_name: rag-offline
    ports:
      - "3000:3000"   # Next.js Web UI
      - "8000:8000"   # FastAPI REST API (chat, search, topics)
      - "9081:9081"   # MCP server (Streamable HTTP /mcp + SSE /sse)
    volumes:
      - ../rag-generation/output/chroma_db:/data/chroma_db
      - ../rag-generation/output/skills:/data/skills:ro
      - ./backend:/app/backend
      - ./entrypoint.sh:/app/entrypoint.sh
      # - ./backend/config/mcp-tools.yaml:/app/backend/config/mcp-tools.yaml  # раскомментировать для правки конфига (в т.ч. feedback.enabled) без пересборки
    environment:
      - RAG_DB_PATH=/data/chroma_db
      - RAG_SKILLS_PATH=/data/skills
      # ── Chroma ───────────────────────────────────────────────────
      # file (по умолчанию) — читать индекс напрямую из тома.
      # server — ходить в контейнер chroma; тогда генератор может
      # дописывать чанки, не останавливая ассистента:
      #   docker compose --profile chroma up -d
      # и здесь же CHROMA_MODE=server. Подробнее — docs/modes.md.
      - CHROMA_MODE=${CHROMA_MODE:-file}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Адрес, по которому ассистент виден снаружи -- подставляется в
      # download_url для get_skill/list_skills (агент качает архив с машины
      # разработчика, не изнутри контейнера). Поменять на реальный адрес,
      # если ассистент не на localhost разработчика.
      - PUBLIC_BASE_URL=http://localhost:8000
      # ── LLM connector ────────────────────────────────────────────
      # Local llm service by default. For a corporate model, point
      # LLM_BASE_URL at it and supply the key — the API shape is the same.
      #- LLM_BASE_URL=http://llm:9080
      #- LLM_MODEL_NAME=qwen2.5
      - LLM_BASE_URL=https://api.neuraldeep.ru/
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME}
      # ── Embedding prefixes ───────────────────────────────────────
      # Must match what rag-generation used when building the database.
      # - RAG_EMBED_E5_PREFIXES=1
      - LOG_LEVEL=DEBUG
      - MCP_SERVER_URL=http://localhost:9081/mcp
      # - MCP_SERVER_URL=http://mcp-service.rag-namespace.svc.cluster.local:9081/mcp  # для Kubernetes
      - NEXT_PUBLIC_FASTAPI_URL=http://localhost:8000
      # ── Обратная связь ───────────────────────────────────────────
      # Включается в backend/config/mcp-tools.yaml (feedback.enabled).
      # Postgres поднимается только с профилем: docker compose --profile feedback up -d
      - FEEDBACK_DB_URL=postgresql+psycopg://rag:rag@feedback-db:5432/rag_feedback
      # Пустой токен = админ-API выключен целиком (а не открыт всем).
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    depends_on:
      - llm
    restart: unless-stopped

  # Chroma в серверном режиме. Под профилем: обычный `docker compose up` его
  # НЕ поднимает, ассистент читает индекс из тома напрямую (CHROMA_MODE=file).
  # Включить:  CHROMA_MODE=server docker compose --profile chroma up -d
  #
  # Порт проброшен на хост, потому что генератор живёт в ДРУГОМ compose-проекте
  # со своей сетью: он подключается по localhost:8001. Иначе пришлось бы
  # заводить общую внешнюю сеть -- лишний шаг при запуске.
  #
  # Тег версии зафиксирован намеренно: рассинхрон версий клиента (chromadb в
  # requirements.txt) и сервера даёт неочевидные ошибки на ровном месте.
  chroma:
    image: chromadb/chroma:1.5.9
    profiles: ["chroma"]
    container_name: rag-chroma
    ports:
      - "8001:8000"
    volumes:
      # Тот же формат на диске, что и у встроенного режима -- существующий
      # индекс подхватывается как есть, миграция не нужна.
      - ../rag-generation/output/chroma_db:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    # healthcheck намеренно нет: образ 1.5.x минималистичный, внутри только
    # бинарь chroma -- ни curl, ни wget, ни python. Проверка, которая всегда
    # рапортует "unhealthy", хуже отсутствующей. Снаружи живость видна по
    # http://localhost:8001/api/v2/heartbeat.
    #
    # depends_on со стороны ассистента тоже нет: chroma под профилем, а
    # зависимость на сервис вне активного профиля ломает обычный
    # `docker compose up`.
    restart: unless-stopped

  # Хранилище обратной связи. Под профилем: обычный `docker compose up` его НЕ
  # поднимает, ассистент работает без БД (feedback.enabled: false).
  # Включить:  docker compose --profile feedback up -d
  #
  # Намеренно без depends_on со стороны ассистента: тот обязан переживать
  # отсутствие БД в любом случае (иначе упавший Postgres утащил бы за собой
  # весь контейнер через `wait -n` в entrypoint.sh).
  feedback-db:
    image: postgres:16-alpine
    profiles: ["feedback"]
    container_name: rag-feedback-db
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
      - POSTGRES_DB=rag_feedback
    ports:
      - "5432:5432"
    volumes:
      # Единственные невосстановимые данные в системе: chroma_db и архивы
      # скиллов пересобираются из исходников, обратная связь -- нет.
      - feedback-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_feedback"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  feedback-db-data:
