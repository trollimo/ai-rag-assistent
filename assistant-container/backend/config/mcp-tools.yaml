# ── LLM (llama-server) ────────────────────────────────────────────
llm:
  ctx_size: 8192       # контекстное окно модели (токенов). Один токен ~4 символа
  max_tokens: 4096     # макс. токенов в ответе LLM

# ── MCP-инструменты (видит LLM-агент) ─────────────────────────────
tools:
  search_docs:
    description: >
      Search local knowledge base for relevant documentation chunks.
      Use this when the user asks about internal documentation, rules,
      skills, project conventions, or any project-specific knowledge.

  list_topics:
    description: >
      List distinct source topics available in the knowledge base.
      Use this to understand what documentation is indexed, or to
      check if a specific topic (e.g. "Nexus") is present in the RAG.

  list_skills:
    description: >
      List installable skills available in the knowledge base -- each
      one is a self-contained folder (SKILL.md plus supporting files)
      that can be downloaded as a zip and installed locally. Use this
      to discover what skills exist before deciding whether to fetch one.

  get_skill:
    description: >
      Get full metadata for one skill by name, including a download_url
      for its archive, a sha256 to verify the download, and step-by-step
      install instructions. Use search_docs or list_skills first to find
      the skill's exact name.

# ── Поиск (REST /search, MCP search_docs) ─────────────────────────
search:
  default_top_k: 5    # сколько чанков возвращать по умолчанию
  # Отсекать результаты дальше этой дистанции (chromadb l2, чем меньше — тем
  # ближе). Применяется НЕ к топ-1 (см. retriever.py) — короткие keyword-запросы
  # без контекста ("Deployment") дают дистанцию заметно выше, чем та же тема во
  # фразе ("Расскажи про deployment"), топ-1 всё равно остаётся правильным
  # документом почти всегда. 300 — грубая граница по замерам на текущем корпусе;
  # при росте базы или смене embedding-модели дистанции сдвинутся, порог нужно
  # переоценить (см. rag-generation/docs/embedding-model-research.md).
  # null — не отсекать вовсе (старое поведение, всегда top_k результатов).
  max_distance: 300
  # Доп. вызов LLM перед поиском: разворачивает сленг/сокращения в вопросе
  # ("кубер" -> "Kubernetes") перед эмбеддингом. +1 обращение к LLM на каждый
  # вопрос (латентность), но заметно лучше retrieval на неформальных
  # формулировках. false — отключить, эмбедить вопрос как есть.
  normalize_query: true

# ── Темы (REST /topics, MCP list_topics) ──────────────────────────
topics:
  default_top_k: 100  # сколько тем возвращать по умолчанию
  max_topics: 500     # макс. количество тем в одном ответе

# ── Обратная связь: реакции, витрина запросов ─────────────────────
# ВАЖНО: enabled: false -- это полный выключатель модуля. Postgres не
# нужен и не поднимается, кнопки реакций и вкладка "Запросы" скрыты,
# ассистент работает ровно как до появления этой фичи. Так и должно
# быть в контурах, где отдельная БД недоступна или не нужна.
feedback:
  enabled: false
  # Писать КАЖДОЕ взаимодействие (вопрос + ответ + какие чанки нашлись),
  # а не только те, по которым нажали кнопку. Именно это даёт материал
  # для витрины: вопрос, на который база не ответила и после которого
  # человек молча ушёл, никакой кнопкой не соберёшь.
  # false -- на диск попадает только то, по чему явно дали обратную связь
  # (витрина при этом видит лишь пробелы, отмеченные через 👎).
  log_questions: true
  # Чистка секретов перед записью. Выключать не стоит: смысл в том, чтобы
  # пароля/токена не было на диске вообще, а не только в публичной выдаче.
  redact: true
  # Публичная вкладка "Запросы" -- витрина непокрытых тем с голосованием.
  showcase: true
  # Сколько РАЗНЫХ client_id должны спросить про тему, чтобы она попала в
  # публичную витрину. Тема, спрошенная одним человеком один раз, чаще
  # содержит его личные вставленные данные; тема от нескольких людей --
  # это уже настоящий пробел. 1 -- публиковать сразу.
  publish_threshold: 2
  # Как часто фоновая задача кластеризует непокрытые вопросы в темы.
  cluster_interval_minutes: 10
  # Порог расстояния между эмбеддингами вопросов, при котором они
  # считаются одной темой. Меньше -- строже (больше мелких тем).
  cluster_max_distance: 180
  # Токен для админ-раздела (/admin/*). Пустой -- админ-API выключен.
  # Задавать через переменную окружения ADMIN_TOKEN, не тут.
  admin_token_env: ADMIN_TOKEN

# ── Реакции на ответ ──────────────────────────────────────────────
reactions:
  # Текст всплывашки кнопки "Знаю больше" -- как поделиться знаниями,
  # которых нет в базе. Правится тут без пересборки образа (см.
  # docker-compose.yml, закомментированный bind-mount mcp-tools.yaml).
  contribute_hint: >
    Не нашли готовый ответ, но знаете его сами? Самый быстрый способ
    пополнить базу — оформить Pull Request с новым .md-файлом в
    репозитории документации. Как именно — уточним отдельно.

# ── Скиллы (REST /skills, MCP list_skills/get_skill) ──────────────
skills:
  # Шаблон инструкции по установке, отдаётся вместе с get_skill. {name} и
  # {download_url} подставляются на сервере. Путь установки специфичен для
  # OpenCode -- при поддержке другого агента текст здесь придётся расширить.
  install_hint: >
    mkdir -p ~/.config/opencode/skills/{name}

    curl -fsSL {download_url} -o /tmp/{name}.zip

    unzip -o /tmp/{name}.zip -d ~/.config/opencode/skills/{name}