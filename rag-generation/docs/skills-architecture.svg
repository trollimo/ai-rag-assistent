<svg width="680" height="490" viewBox="0 0 680 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Пайплайн скиллов: от исходной папки до двух потребителей</title>
<desc>Папка скилла попадает в rag-generator, который создаёт два производных артефакта — векторы в chroma_db и zip-архивы в output/skills. Контейнер ассистента монтирует оба и обслуживает два сценария: OpenCode через MCP получает ссылку и скачивает архив сам, человек скачивает тот же архив кнопкой в Web UI.</desc>

<style>
  .t  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 400; }
  .th { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; }
  .ts { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; }

  .gray  rect, circle.gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .gray  .th { fill: #444441; } .gray  .ts { fill: #5F5E5A; }
  .purple rect, circle.purple { fill: #EEEDFE; stroke: #534AB7; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal  rect, circle.teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .teal  .th { fill: #085041; } .teal  .ts { fill: #0F6E56; }
  .coral rect, circle.coral { fill: #FAECE7; stroke: #993C1D; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }

  rect, circle { stroke-width: 0.5; }
  .arr { stroke: #888780; stroke-width: 0.5; fill: none; }
  .legend { fill: #5F5E5A; }

  @media (prefers-color-scheme: dark) {
    .gray  rect, circle.gray  { fill: #444441; stroke: #B4B2A9; }
    .gray  .th { fill: #D3D1C7; } .gray  .ts { fill: #B4B2A9; }
    .purple rect, circle.purple { fill: #3C3489; stroke: #AFA9EC; }
    .purple .th { fill: #CECBF6; } .purple .ts { fill: #AFA9EC; }
    .teal  rect, circle.teal  { fill: #085041; stroke: #5DCAA5; }
    .teal  .th { fill: #9FE1CB; } .teal  .ts { fill: #5DCAA5; }
    .coral rect, circle.coral { fill: #712B13; stroke: #F0997B; }
    .coral .th { fill: #F5C4B3; } .coral .ts { fill: #F0997B; }
    .legend { fill: #B4B2A9; }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="gray">
  <rect x="240" y="40" width="200" height="48" rx="4"/>
  <text class="th" x="340" y="62" text-anchor="middle">docs/skills/&lt;имя&gt;/</text>
  <text class="ts" x="340" y="78" text-anchor="middle">SKILL.md + файлы</text>
</g>

<line class="arr" x1="340" y1="88" x2="340" y2="118" marker-end="url(#arrow)"/>

<g class="purple">
  <rect x="240" y="120" width="200" height="48" rx="4"/>
  <text class="th" x="340" y="142" text-anchor="middle">rag-generator</text>
  <text class="ts" x="340" y="158" text-anchor="middle">чанки + архивы</text>
</g>

<polyline class="arr" points="340,168 340,190 205,190 205,208" marker-end="url(#arrow)"/>
<polyline class="arr" points="340,168 340,190 455,190 455,208" marker-end="url(#arrow)"/>

<g class="teal">
  <rect x="120" y="210" width="170" height="48" rx="4"/>
  <text class="th" x="205" y="232" text-anchor="middle">chroma_db</text>
  <text class="ts" x="205" y="248" text-anchor="middle">векторы</text>
</g>

<g class="teal">
  <rect x="350" y="210" width="210" height="48" rx="4"/>
  <text class="th" x="455" y="232" text-anchor="middle">output/skills/*.zip</text>
  <text class="ts" x="455" y="248" text-anchor="middle">по одному на скилл</text>
</g>

<line class="arr" x1="205" y1="258" x2="205" y2="298" marker-end="url(#arrow)"/>
<line class="arr" x1="455" y1="258" x2="455" y2="298" marker-end="url(#arrow)"/>

<g class="purple">
  <rect x="120" y="300" width="440" height="52" rx="4"/>
  <text class="th" x="340" y="323" text-anchor="middle">rag-offline (ассистент)</text>
  <text class="ts" x="340" y="340" text-anchor="middle">RAG-ответы + раздача архивов</text>
</g>

<line class="arr" x1="220" y1="352" x2="220" y2="388" marker-end="url(#arrow)"/>
<line class="arr" x1="460" y1="352" x2="460" y2="388" marker-end="url(#arrow)"/>

<g class="coral">
  <rect x="120" y="390" width="200" height="52" rx="4"/>
  <text class="th" x="220" y="413" text-anchor="middle">OpenCode (MCP)</text>
  <text class="ts" x="220" y="430" text-anchor="middle">get_skill → URL → curl</text>
</g>

<g class="coral">
  <rect x="360" y="390" width="200" height="52" rx="4"/>
  <text class="th" x="460" y="413" text-anchor="middle">Web UI «Skills»</text>
  <text class="ts" x="460" y="430" text-anchor="middle">кнопка → zip на диск</text>
</g>

<circle class="gray" cx="124" cy="466" r="5"/>
<text class="ts legend" x="134" y="470">исходник</text>
<circle class="purple" cx="206" cy="466" r="5"/>
<text class="ts legend" x="216" y="470">сервисы</text>
<circle class="teal" cx="284" cy="466" r="5"/>
<text class="ts legend" x="294" y="470">артефакты</text>
<circle class="coral" cx="376" cy="466" r="5"/>
<text class="ts legend" x="386" y="470">потребители</text>
</svg>
