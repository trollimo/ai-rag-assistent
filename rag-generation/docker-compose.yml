services:
  generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-generator
    container_name: rag-generator
    volumes:
      - ./output:/rag/output
      - ./docs:/rag/docs:ro
      # Раскомментируй для кастомного конфига (вместо вшитого config/rag-sources.yaml):
      # - ./my-sources.yaml:/rag/config/rag-sources.yaml:ro
    # Внешние папки с .md (для -Source в rag-build.ps1):
    # - c:\skills:/external/skills:ro
    # Раскомментируй для отладки (контейнер живёт 1000с вместо запуска ingest.py):
    # command: sleep 1000
    environment:
      - RAG_OUTPUT=/rag/output
      - HF_HUB_OFFLINE=1
      # Default (256) tries to embed the whole to-embed set in one ONNX batch
      # when it's under that size. Fine for the original small corpus, but a
      # 224-chunk skills batch (many files from one large skill, e.g.
      # java-performance-review) OOM-killed the container (exit 137) inside
      # Docker Desktop's ~6.7GB WSL2 VM limit. Lower default keeps peak
      # memory bounded regardless of how many chunks land in one run.
      - RAG_EMBED_BATCH_SIZE=32
      # ── Chroma ───────────────────────────────────────────────────
      # По умолчанию file: пишем SQLite-индекс в ./output напрямую. Нельзя,
      # пока индекс держит запущенный ассистент.
      # server: писать в контейнер chroma по HTTP -- тогда ассистента
      # останавливать не нужно:
      #   $env:RAG_CHROMA_MODE = "server"; docker compose run --rm generator
      #
      # host.docker.internal, а не localhost: chroma живёт в ДРУГОМ
      # compose-проекте (assistant-container) и виден только через порт,
      # проброшенный на хост. Внутри контейнера "localhost" -- это он сам.
      - RAG_CHROMA_MODE=${RAG_CHROMA_MODE:-file}
      - RAG_CHROMA_HOST=${RAG_CHROMA_HOST:-host.docker.internal}
      - RAG_CHROMA_PORT=${RAG_CHROMA_PORT:-8001}
    extra_hosts:
      # Linux-хостам host.docker.internal не резолвится сам по себе.
      - "host.docker.internal:host-gateway"
