sources:
  - name: rules
    path: ./docs/rules
    include:
      - "**/*.md"

  - name: poetry
    path: ./docs/poetry
    include:
      - "**/*.md"

  - name: kubernetes
    path: ./docs/kubernetes
    include:
      - "**/*.md"

  - name: security
    path: ./docs/security
    include:
      - "**/*.md"

  - name: skills
    path: ./docs/skills
    type: skills           # каждая непосредственная подпапка с SKILL.md — один скилл
    include:
      - "**/*.md"           # что режется в чанки (текст для обсуждения)
    archive:
      # Что попадает в zip целиком (для установки), помимо .md.
      # Вся папка скилла минус эти паттерны.
      exclude:
        - "**/.git/**"
        - "**/.idea/**"
        - "**/node_modules/**"
      max_size_mb: 25

chunking:
  # 🔪 метод разбивки (сплит по заголовкам, fallback — по символам)
  method: markdown_headers_then_fallback
  # 📏 макс. длина одного чанка в символах.
  #   Если секция длиннее — принудительно режется с overlap-ом
  chunk_size: 1200
  # 🔄 перекрытие между соседними чанками (в символах).
  #   Нужно чтобы контекст не терялся на стыках при поиске
  overlap: 200

storage:
  type: chromadb
  # file   — писать SQLite-индекс напрямую (по умолчанию). Нельзя, пока
  #          индекс держит запущенный ассистент: конфликт блокировок.
  # server — писать в контейнер chroma по HTTP. Тогда переиндексация не
  #          требует остановки ассистента (см. docs/modes.md).
  # Переопределяется переменными RAG_CHROMA_MODE / RAG_CHROMA_HOST / RAG_CHROMA_PORT.
  mode: file
  host: localhost
  port: 8001
  path: ./output/chroma_db
  collection: knowledge_base

embeddings:
  model: intfloat/multilingual-e5-large
